<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Admin — Create Admin</title>
  <link rel="icon" href="data:,">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f7f9;
    }

    h2 {
      text-align: center;
    }

    .box {
      background: #fff;
      border: 1px solid #ccc;
      padding: 20px;
      max-width: 460px;
      margin: auto;
      border-radius: 10px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input:not([type="checkbox"]),
    select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    #deptBox {
      display: none;
      margin: 10px 0 15px;
      padding: 12px;
      background: #f8f9fa;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    #deptBox label {
      font-weight: normal;
      margin: 9px 0;
    }

    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #ff6600;
      color: #fff;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #msg {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #credentials {
      display: none;
      margin-top: 18px;
      padding: 15px;
      background: #f0f8f0;
      border: 1px solid #8abf8a;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }

    .credential-value {
      user-select: text;
      font-weight: bold;
      margin: 6px 0 14px;
    }

    .notice {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <h2>SYSTEM ADMIN → CREATE ADMIN</h2>

  <main class="box">
    <form id="createAdminForm">
      <label for="name">Admin Name</label>
      <input
        id="name"
        name="name"
        type="text"
        maxlength="100"
        autocomplete="name"
        required
      >

      <label for="adminType">Admin Type</label>
      <select id="adminType" name="adminType" required>
        <option value="">Select Admin Type</option>
        <option value="admin_a">Admin A (Full Access)</option>
        <option value="admin_b">Admin B (Department Access)</option>
      </select>

      <fieldset id="deptBox">
        <legend>Select Departments</legend>

        <label>
          <input type="checkbox" name="departments" value="finance">
          Finance
        </label>

        <label>
          <input type="checkbox" name="departments" value="franchisee">
          Franchisee
        </label>

        <label>
          <input type="checkbox" name="departments" value="kyc">
          KYC
        </label>
      </fieldset>

      <button id="createBtn" type="submit">Create Admin</button>
    </form>

    <p id="msg" role="status" aria-live="polite"></p>

    <section id="credentials" aria-live="polite">
      <h3>Generated Admin Credentials</h3>

      <label>Admin ID</label>
      <p id="generatedAdminId" class="credential-value"></p>

      <label>Initial Password</label>
      <p id="generatedPassword" class="credential-value"></p>

      <p class="notice">
        Save these credentials securely and provide them only to the
        intended account holder. Confirm login and password-change
        functionality before production use.
      </p>
    </section>
  </main>

  <script src="core_boot_manager.js"></script>
  <script src="core_initializer.js"></script>
  <script src="core_session_authority.js"></script>
  <script src="core_auth_password_manager.js"></script>
  <script src="system_admin_admin_creation_controller.js"></script>
</body>
</html>
